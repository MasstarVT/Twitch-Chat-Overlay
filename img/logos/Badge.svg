<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36">
  <!-- Dark Terminal Background with Green Border -->
  <rect x="2" y="2" width="32" height="32" rx="6" fill="#0d0d0d" stroke="#00ff66" stroke-width="2"/>
  
  <!-- Terminal Prompt '>' -->
  <path d="M 10,11 L 18,18 L 10,25" fill="none" stroke="#00ff66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Underscore Cursor '_' -->
  <line x1="21" y1="25" x2="27" y2="25" stroke="#00ff66" stroke-width="3" stroke-linecap="round"/>
</svg>
