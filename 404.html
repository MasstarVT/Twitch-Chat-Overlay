<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- GitHub Pages serves this for any address that doesn't exist: it sends the visitor on to the home page, keeping
       the query and hash (an old settings link still reaches the builder through it). Its one inline script is allowed
       by its hash (tests/security.test.js checks it). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-QozUOxwj7MOVrm+7je3LT094pMLymd9dEAAd14EF9Jc='; base-uri 'none'; form-action 'none'">
  <meta name="robots" content="noindex">
  <title>Twitch Chat Overlay</title>
  <script>(function(){var l=window.location,b=/\.github\.io$/i.test(l.hostname)?'/'+(l.pathname.split('/')[1]||'')+'/':'/';l.replace(b.replace(/\/+$/,'/')+l.search+l.hash);})();</script>
  <noscript><meta http-equiv="refresh" content="0; url=/"></noscript>
</head>
<body>
  <p><a href="/">Go to the home page</a></p>
</body>
</html>
