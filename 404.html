<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- GitHub Pages serves this for any address that doesn't exist: it sends the visitor on to the home page, keeping
       the query and hash (an old settings link still reaches the builder through it), a '#' typed at the end of
       a value too (as home.js passedOn). Its one inline script is allowed
       by its hash (tests/security.test.js checks it). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-n0oisW4+qgGULXqJD6wGpMqkioOXG3YgdmCQWvOfuuE='; base-uri 'none'; form-action 'none'">
  <meta name="robots" content="noindex">
  <title>Twitch Chat Overlay</title>
  <script>(function(){var l=window.location,h=l.href,q=h.indexOf('?'),f=h.indexOf('#'),b=/\.github\.io$/i.test(l.hostname)?'/'+(l.pathname.split('/')[1]||'')+'/':'/';l.replace(b.replace(/\/+$/,'/')+(q>=0&&(f<0||f>q)?h.slice(q):l.search+l.hash));})();</script>
  <noscript><meta http-equiv="refresh" content="0; url=/"></noscript>
</head>
<body>
  <p><a href="/">Go to the home page</a></p>
</body>
</html>
